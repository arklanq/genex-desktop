<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: studio-plugin: https://cdn.genex.technology https://assets.genex.games https://assets.genex.technology https://api.genex.games https://lh3.googleusercontent.com https://avatars.githubusercontent.com; media-src 'self' blob: https://cdn.genex.technology https://assets.genex.games https://assets.genex.technology; connect-src 'self' blob: data: https://assets.genex.technology https://assets.genex.games; worker-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'; frame-src studio-plugin:" />
    <title>Genex</title>
    <!-- Emitted by the Tailwind CLI from src/renderer/theme.css (see scripts/build.mjs).
         Without the link the whole app renders unstyled — dark text on a dark window. -->
    <link rel="stylesheet" href="./theme.css" />
    <!-- The saved appearance, or the system's light or dark, before anything paints. -->
    <script src="./first-paint.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The window's first screen, there before the app's bundle: the Genex G, faint in the theme's
         ink, with a light passing over it now and then (theme.css). Outside #root so React's first
         render leaves it; app-loader.ts fades it out once the first screen is drawn. -->
    <div id="app-loader" class="app-loader" role="status" aria-label="Opening Genex">
      <svg class="app-loader-mark" viewBox="0 0 683 533" aria-hidden="true">
        <defs>
          <clipPath id="app-loader-g">
            <path d="M526.479 314.98H239.981V266.964H683V397.295C683 397.295 648.57 532.96 347.968 532.96C347.968 532.96 0 542.868 0 252.483C0 -16.5617 376.426 0.205967 376.426 0.205967C666.184 0.205967 683 141.207 683 141.207L607.973 153.401C607.973 153.401 584.689 45.1737 371.252 45.1737C371.252 45.1737 85.375 34.5034 85.375 257.818C85.375 257.818 78.9072 480.37 351.849 486.467C566.58 493.327 597.625 379.002 600.212 359.186C607.973 334.034 574.341 314.98 526.479 314.98Z" />
          </clipPath>
          <linearGradient id="app-loader-light">
            <stop offset="0" stop-color="currentColor" stop-opacity="0" />
            <stop offset="0.5" stop-color="currentColor" />
            <stop offset="1" stop-color="currentColor" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g clip-path="url(#app-loader-g)">
          <rect class="app-loader-ground" width="683" height="533" fill="currentColor" />
          <rect class="app-loader-shine" x="-420" width="420" height="533" fill="url(#app-loader-light)" />
        </g>
      </svg>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
