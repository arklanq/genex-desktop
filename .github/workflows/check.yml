name: Check
# Plan the complete Linux baseline + affected inventory once, then run independent shards.
# `gate` and `fast` remain stable, fail-closed aggregate checks. macOS still belongs only to
# main and owner dispatches; labels never replace a code-event run with a skipped one.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      seed_matrix: ${{ steps.plan.outputs.seed_matrix }}
      harness_matrix: ${{ steps.plan.outputs.harness_matrix }}
      harness_selected: ${{ steps.plan.outputs.harness_selected }}
      fast_matrix: ${{ steps.plan.outputs.fast_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Select and partition the complete test inventory
        id: plan
        env:
          STUDIO_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$STUDIO_TEST_BASE" ] || ! git cat-file -e "$STUDIO_TEST_BASE^{commit}" 2>/dev/null; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              STUDIO_TEST_BASE=$(git rev-parse HEAD^)
            else
              STUDIO_TEST_BASE=$(git hash-object -t tree /dev/null)
            fi
          fi
          node scripts/ci-test-plan.mjs plan --base "$STUDIO_TEST_BASE" --output .studio-dev/ci/plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-test-plan
          path: .studio-dev/ci/plan.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  static:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Test-style additions are checked against the merge base with origin/dev.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:architecture
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/check-test-style.ts
      # Public cases only; --with-holdouts never runs in CI.
      - name: Eval case isolation
        run: node scripts/evals/check-isolation.ts
  unit:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unit_matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Linux process sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: npm ci --ignore-scripts
      - name: Patch the sandbox runtime as postinstall does
        run: node --input-type=module -e "await (await import('./scripts/patch-sandbox-runtime.mjs')).patchSandboxRuntime()"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: check-test-plan
          path: .studio-dev/ci
      - name: Baseline and affected behavior tests
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci-test-plan.mjs run --plan .studio-dev/ci/plan.json --group unit --shard "$SHARD"
  harness:
    needs: plan
    if: needs.plan.outputs.harness_selected == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.harness_matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Linux process sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: npm ci --ignore-scripts
      - name: Patch the sandbox runtime as postinstall does
        run: node --input-type=module -e "await (await import('./scripts/patch-sandbox-runtime.mjs')).patchSandboxRuntime()"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: check-test-plan
          path: .studio-dev/ci
      - name: Selected harness behavior gate
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci-test-plan.mjs run --plan .studio-dev/ci/plan.json --group harness --shard "$SHARD"
  seed:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.seed_matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Linux process sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: npm ci --ignore-scripts
      - name: Patch the sandbox runtime as postinstall does
        run: node --input-type=module -e "await (await import('./scripts/patch-sandbox-runtime.mjs')).patchSandboxRuntime()"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: check-test-plan
          path: .studio-dev/ci
      - name: Mandatory seed upgrade contracts
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci-test-plan.mjs run --plan .studio-dev/ci/plan.json --group seed --shard "$SHARD"
  gate:
    if: always()
    needs: [plan, static, unit, seed, harness]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every selected Linux check
        env:
          STUDIO_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-check-result.mjs gate
  fast-tests:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.fast_matrix) }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Retain the macOS static gates once, alongside the first test shard.
      - if: matrix.shard == 1
        run: npm run verify:architecture
      - if: matrix.shard == 1
        run: npm run typecheck
      - if: matrix.shard == 1
        run: npm run lint
      - if: matrix.shard == 1
        run: node scripts/check-test-style.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: check-test-plan
          path: .studio-dev/ci
      - name: Complete macOS fast inventory shard
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci-test-plan.mjs run --plan .studio-dev/ci/plan.json --group fast --shard "$SHARD"
  fast:
    if: always() && (github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.ref == 'refs/heads/main')
    needs: [plan, fast-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every macOS fast shard
        env:
          STUDIO_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-check-result.mjs fast
